[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuite-seatpool"
version = "0.1.0"
description = "Configurable DNS adapters, Google Directory provisioning, MIME ingestion, and local inventory allocation."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "curl_cffi>=0.7",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
google = ["google-auth>=2.29", "requests>=2.31"]
mock = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
gsuite-seatpool = "gsuite_seatpool.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
