[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuite-seatpool"
version = "0.1.0"
description = "Multi-domain DNS zone provisioner, Cloud Identity 50-seat directory generator, catch-all MIME OTP router, and round-robin seat allocator."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
mock = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
gsuite-seatpool = "gsuite_seatpool.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
