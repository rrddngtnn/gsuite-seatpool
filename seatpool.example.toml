schema_version = 1
db = "gsuite_seatpool.db"
catchall_target = "master@example.test"

[dns]
provider = "manual"
# Cloudflare: provider = "cloudflare", zone_id = "your-zone-id",
# token_env = "CLOUDFLARE_API_TOKEN".
# Registrar: provider = "registrar", base_url = "https://registrar.example.test",
# email_env = "REGISTRAR_EMAIL", password_env = "REGISTRAR_PASSWORD".

[directory]
base_url = "https://admin.googleapis.com"
# Supply GOOGLE_DIRECTORY_TOKEN in the environment, or configure:
# authorized_user_file = "./private/authorized-user.json"
# Or service_account_file plus delegated_admin for domain-wide delegation.
# service_account_file = "./private/service-account.json"
# delegated_admin = "admin@example.test"

# Optional mailbox-scoped TMail v1 HTTP ingestion (no local TMail dependency):
# [mail]
# provider = "tmail_v1"
# url = "https://mail.example.test"
# mailbox = "seat@example.test"
# bearer_env = "MAIL_API_TOKEN"
# max_pages = 10
# Export MAIL_API_TOKEN, then run inbox-pull --limit 50.
# Do not put the token in this file or use an administrator token.
